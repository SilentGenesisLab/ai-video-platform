name: ai-video-platform
x-app-env: &app-env
  DATABASE_URL: postgresql://aivideo:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/aivideo
  REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379
  APP_URL: https://${DOMAIN:?set DOMAIN}
  AGENT_URL: http://agent:8000
  BUSINESS_API_URL: http://web:3000
  AGENT_DATABASE_URL: postgresql://aivideo:${POSTGRES_PASSWORD}@postgres:5432/aivideo
services:
  postgres:
    image: postgres:16-bookworm
    environment:
      POSTGRES_USER: aivideo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: aivideo
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aivideo -d aivideo"]
      interval: 5s
      retries: 20
    restart: unless-stopped
  redis:
    image: redis:7.4-bookworm
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--requirepass",
        "${REDIS_PASSWORD}",
      ]
    volumes: ["redis-data:/data"]
    restart: unless-stopped
  migrate:
    build: .
    env_file: .env
    environment: *app-env
    command: ["sh", "-c", "npm run db:migrate && npm run db:seed"]
    depends_on:
      postgres: { condition: service_healthy }
  web:
    build: .
    env_file: .env
    environment: *app-env
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_started }
    restart: unless-stopped
  worker:
    build: .
    env_file: .env
    environment: *app-env
    command: ["node", "--import", "tsx", "src/worker/index.ts"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_started }
    restart: unless-stopped
  agent:
    build:
      context: .
      dockerfile: agent/Dockerfile
    env_file: .env
    environment: *app-env
    depends_on:
      web: { condition: service_started }
    restart: unless-stopped
  proxy:
    image: caddy:2
    environment:
      DOMAIN: ${DOMAIN}
    ports: ["80:80", "443:443"]
    volumes:
      [
        "./deploy/Caddyfile:/etc/caddy/Caddyfile:ro",
        "caddy-data:/data",
        "caddy-config:/config",
      ]
    depends_on: [web]
    restart: unless-stopped
volumes:
  postgres-data:
  redis-data:
  caddy-data:
  caddy-config:
