server {
    listen 80;
    server_name aivideo.sligenai.cn;
    location ^~ /.well-known/acme-challenge/ { root /var/www/aivideo-acme; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    server_name aivideo.sligenai.cn;
    ssl_certificate /etc/letsencrypt/live/aivideo.sligenai.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aivideo.sligenai.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 513m;
    # The n8n bridge separately authenticates every request and only executes
    # pre-existing running plan jobs. Other internal endpoints stay blocked.
    location ^~ /api/v1/internal/n8n-plan/ {
        client_max_body_size 256k;
        proxy_pass http://127.0.0.1:3210;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 240s;
        proxy_buffering off;
    }
    location ^~ /api/v1/internal/ { return 404; }
    location / {
        proxy_pass http://127.0.0.1:3210;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }
}
